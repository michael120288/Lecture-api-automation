          #   BASE_URL, TEST_USERNAME, TEST_PASSWORD, DATABASE_URL
          # Use ${{ secrets.NAME }} syntax — same as in tests.yml.
          # write your code here

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # TODO 5 ─────────────────────────────────────────────────────────────
          # Set the artifact name to "nightly-results-node-{node-version}"
          # Set retention-days to 14 (nightly results need longer than 7 days
          # so you can compare two weeks of runs side by side).
