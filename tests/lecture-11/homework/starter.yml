# Add a `schedule:` trigger that runs at midnight UTC every day.
#
# The `schedule:` trigger uses cron syntax — 5 space-separated fields:
#   ┌── minute (0–59)
#   │  ┌── hour (0–23, UTC)
#   │  │  ┌── day of month (1–31)
#   │  │  │  ┌── month (1–12)
#   │  │  │  │  ┌── day of week (0–6, Sunday=0)
#   *  *  *  *  *
#
# Midnight UTC every day = "0 0 * * *"
# Every Sunday at 3am UTC = "0 3 * * 0"
#
# Pattern:
#   on:
#     schedule:
#       - cron: '<expression>'
#
